<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Supercell Hunter Web</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; display: inline-block; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        input { background: #334155; color: white; }
        button { background: #22c55e; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #16a34a; }
        .stats-grid { display: flex; justify-content: space-around; margin-top: 20px; }
        .stat-box { background: #334155; padding: 15px; border-radius: 8px; width: 20%; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Supercell Hunter Web</h2>
        <input type="text" id="token" placeholder="تويكن البوت (Bot Token)"><br>
        <input type="text" id="chat_id" placeholder="آي دي الشات (Chat ID)"><br>
        <input type="file" id="comboFile" accept=".txt" style="display:none" onchange="fileSelected()">
        <button onclick="document.getElementById('comboFile').click()">اختر ملف الكومبو</button>
        <p id="fileStatus">لم يتم رفع ملف</p>
        <button id="startBtn" onclick="startChecking()" style="display:none;">بدء الفحص</button>
    </div>

    <div class="stats-grid" style="margin-top: 40px;">
        <div class="stat-box"><h3>Hits</h3><p id="hits">0</p></div>
        <div class="stat-box"><h3>Bad</h3><p id="bad">0</p></div>
        <div class="stat-box"><h3>Unlink</h3><p id="unlink">0</p></div>
        <div class="stat-box"><h3>Errors</h3><p id="errors">0</p></div>
    </div>
    <h3 id="statusText">الحالة: بانتظار الملف</h3>

    <script>
        let uploadedFile = null;

        function fileSelected() {
            const input = document.getElementById('comboFile');
            if (input.files.length > 0) {
                uploadedFile = input.files[0];
                document.getElementById('fileStatus').innerText = "تم استلام الملف: " + uploadedFile.name;
                document.getElementById('startBtn').style.display = 'inline-block';
            }
        }

        function startChecking() {
            let formData = new FormData();
            formData.append('file', uploadedFile);
            formData.append('token', document.getElementById('token').value);
            formData.append('chat_id', document.getElementById('chat_id').value);

            fetch('/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert("تم بدء الفحص! عدد الأسطر: " + data.lines);
                    setInterval(updateStats, 2000);
                } else {
                    alert("حدث خطأ: " + data.error);
                }
            });
        }

        function updateStats() {
            fetch('/stats').then(res => res.json()).then(data => {
                document.getElementById('hits').innerText = data.hits;
                document.getElementById('bad').innerText = data.bad;
                document.getElementById('unlink').innerText = data.unlink;
                document.getElementById('errors').innerText = data.errors;
                document.getElementById('statusText').innerText = "الحالة: " + data.status + " (" + data.processed + "/" + data.total + ")";
            });
        }
    </script>
</body>
</html>
